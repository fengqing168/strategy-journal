var q=new URLSearchParams(window.location.search).get('q');
if(q){inp.value=q;doSearch(q)}
inp.addEventListener('input',function(){doSearch(this.value)});
function doSearch(s){
if(!s||s.length<1){res.innerHTML='<div class="search-hint">输入关键词开始搜索</div>';return}
var t=s.toLowerCase().split(/\s+/);
var o=idx.filter(function(i){return t.every(function(k){return i.w.toLowerCase().indexOf(k)>-1})});
res.innerHTML=o.length?o.map(function(i){return'<div class="log-item"><a href="'+i.u+'" class="log-link"><div class="log-meta"><span class="log-num">#'+i.u.match(/\d+/)[0]+'</span><span class="log-date">'+i.d+'</span></div><div class="log-title">'+i.t+'</div></a></div>'}).join(''):'<div class="search-hint">没有找到匹配的日志</div>'
}}());
